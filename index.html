<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="origin">
    <title>Clean Live Stream Digital Signage</title>
    <style>
        /* Essential styles to force the video player to fill the entire screen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- 
    Updated to include Closed Captions (cc_load_policy=1) and hide Annotations (iv_load_policy=3).
    -->
    <iframe 
        src="https://www.youtube.com/embed/iEpJwprxDdk?autoplay=1&mute=1&controls=0&modestbranding=1&cc_load_policy=1&iv_load_policy=3"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"> 
    </iframe>
</body>
</html>
