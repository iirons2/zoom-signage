<!DOCTYPE html>
<html>
<head>
    <title>Live Stream Digital Signage</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: black; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <!-- This forces the clean, full-screen player view -->
    <iframe 
        src="https://www.youtube.com/embed/iEpJwprxDdk?autoplay=1&mute=1&controls=0&modestbranding=1"
        allow="autoplay; fullscreen; encrypted-media" 
        allowfullscreen>
    </iframe>
</body>
</html>
