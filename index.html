<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Live Stream Digital Signage</title>
    <style>
        /* Essential styles to force the video player to fill the entire screen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents scrollbars */
            background-color: black;
            font-family: sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- 
    The embedded YouTube player using the "embed" URL path.
    Updated to include cc_lang_pref=en to explicitly request English captions.
    -->
    <iframe 
        src="https://www.youtube.com/embed/iEpJwprxDdk?autoplay=1&mute=1&controls=0&modestbranding=1&cc_load_policy=1&iv_load_policy=3&cc_lang_pref=en"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
        allowfullscreen>
    </iframe>
</body>
</html>
