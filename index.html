<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Explicit referrer policy: YouTube rejects embeds with no Referer header (Error 153) -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Clean Live Stream Digital Signage</title>
    <style>
        /* Essential styles to force the video player to fill the entire screen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents scrollbars */
            background-color: black;
            font-family: sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!--
    Embedded YouTube player using the privacy-enhanced youtube-nocookie.com domain.
    Testing whether this embed host is accepted by the Zoom Rooms / Logitech Roommate
    signage webview, which gets "This content isn't available" on youtube.com embeds.
    cc_lang_pref=en requests English captions.
    referrerpolicy is set explicitly so the Referer header is sent (fixes Error 153).
    To revert: change www.youtube-nocookie.com back to www.youtube.com.
    -->
    <iframe
        src="https://www.youtube-nocookie.com/embed/QB5BNdBFujE?autoplay=1&mute=1&controls=0&cc_load_policy=1&iv_load_policy=3&cc_lang_pref=en"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>
</body>
</html>
